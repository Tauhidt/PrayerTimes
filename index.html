<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Prayer Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --accent: #38bdf8; --ramadan-gold: rgba(251, 191, 36, 0.2);
            --gps-btn: #10b981; --log-bg: #020617;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Status Log Style */
        #statusLog {
            background: var(--log-bg);
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            border-left: 4px solid var(--accent);
            min-height: 20px;
        }

        .controls { 
            background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; 
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;
        }
        .search-group { display: flex; gap: 8px; flex-grow: 1; max-width: 600px; }
        input { flex-grow: 1; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { padding: 10px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-search { background: var(--accent); color: #0f172a; }
        .btn-gps { background: var(--gps-btn); color: white; }
        
        .prayer-box { background: var(--card-bg); text-align: center; padding: 20px; border-radius: 12px; border-bottom: 4px solid var(--accent); }
        .current-day-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .ramadan-row { background-color: var(--ramadan-gold) !important; }
        .event-badge { font-size: 0.7rem; background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        .section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .table-wrapper { overflow-x: auto; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: #334155; padding: 12px; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
<div class="container">
    <div id="statusLog">> System ready. Waiting for input...</div>

    <div class="controls">
        <div class="search-group">
            <input type="text" id="cityInput" placeholder="Enter city (e.g. Mecca, London...)">
            <button class="btn-search" onclick="handleManualLocation()">Set</button>
            <button class="btn-gps" id="gpsBtn" onclick="useCurrentLocation()">📍 GPS</button>
        </div>
        <div class="date-selectors">
            <select id="monthSelect" onchange="updateCalendar()"></select>
            <select id="yearSelect" onchange="updateCalendar()"></select>
        </div>
    </div>

    <header style="text-align:center; margin-bottom: 30px;">
        <h1 id="locDisplay" style="margin:0;">Prayer Times</h1>
        <p id="dateDisplay" style="color: var(--accent);"></p>
    </header>

    <div id="todayGrid" class="current-day-card"></div>

    <div class="section">
        <h3>Monthly Schedule</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>Date (Hijri)</th><th>Fajr</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>Prayer Trends</h3>
            <select id="timespanSelect" onchange="updateChart()">
                <option value="1">1 Month</option>
                <option value="3">90 Days</option>
                <option value="12">1 Year</option>
            </select>
        </div>
        <div style="height: 450px;">
            <canvas id="prayerChart"></canvas>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
