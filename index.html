<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Daily Prayer Times</h1>
        <p id="location-display">Loading location...</p>
        <button id="manual-location-btn">Set Location</button>
    </header>

    <main id="prayer-times-container">
        <div class="loading-message">Loading times...</div>
    </main>

    <div id="location-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Set Location Manually</h2>
            <div class="input-group">
                <label for="city-input">City:</label>
                <input type="text" id="city-input" placeholder="e.g., London">
            </div>
            <div class="input-group">
                <label for="country-input">Country:</label>
                <input type="text" id="country-input" placeholder="e.g., UK">
            </div>
            <button id="save-location-btn">Save Location</button>
            <p id="manual-location-error" class="error-message"></p>
            <hr>
            <button id="use-gps-btn">Use Device Location (GPS)</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Prayer Times</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
